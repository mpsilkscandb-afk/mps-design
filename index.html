<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MPS Silks — Design Registry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#register" aria-label="MPS Silks">
    <img src="assets/mps-logo.png" alt="" class="logo logo-mps" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wordmark',textContent:'MPS SILKS'}))">
  </a>
  <nav class="nav" id="nav" aria-label="Main">
    <a href="#register" data-view="register">Register</a>
    <a href="#catalogue" data-view="catalogue">Catalogue</a>
    <a href="#status" data-view="status">Status</a>
    <a href="#report" data-view="report">Report</a>
    <a href="#settings" data-view="settings">Settings</a>
  </nav>
  <div class="partner">
    <span class="by">Prepared by</span>
    <img src="assets/cb-logo.png" alt="" class="logo logo-cb" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'wordmark small',textContent:'C&B'}))">
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="app" tabindex="-1"></main>

<footer class="foot">
  <span>MPS Silks · Design Registry</span>
  <span id="foot-mode"></span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
